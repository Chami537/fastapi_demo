services:
  fastapi:
    build: .
    container_name: fastapi-demo
    restart: always
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    container_name: fastapi-postgres
    restart: always
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
